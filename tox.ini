[tox]
envlist =
    py{311, 312, 313, 314, 315}-sqlalchemy{20, 21}
    ruff
labels =
    update = update-{requirements, pre-commit}

[testenv]
commands = pytest
dependency_groups = test
passenv =
    DB
    DATABASE_URL
deps =
    sqlalchemy20: SQLAlchemy>=2.0,<2.1
    sqlalchemy21: SQLAlchemy>=2.1
recreate = True

[testenv:ruff]
skip_install = True
recreate = False
deps = pre-commit
commands =
    pre-commit run --all-files ruff-check
    pre-commit run --all-files ruff-format
